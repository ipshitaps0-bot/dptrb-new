name: DPTRB Demo

on:
  workflow_dispatch:

jobs:
  run-dptrb:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare DPTRB project structure
        run: |
          mkdir -p services/routing
          mkdir -p services/ingestion
          mkdir -p db

          # Go routing engine
          cp Dockerfile services/routing/Dockerfile
          cp go.mod services/routing/go.mod
          cp *.go services/routing/

          # Python ingestion service
          cp ingestion_service.py services/ingestion/
          cp requirements.txt services/ingestion/

          cat > services/ingestion/Dockerfile <<'EOF'
          FROM python:3.12-slim

          RUN groupadd -r dptrb && useradd -r -g dptrb dptrb

          WORKDIR /app

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY ingestion_service.py .

          USER dptrb

          ENTRYPOINT ["python", "ingestion_service.py"]
          EOF

          # Database initialization
          cp init.sql db/

          echo "Prepared project structure:"
          find . -maxdepth 3 -type f | sort

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build DPTRB images
        run: |
          docker compose build

      - name: Start infrastructure
        run: |
          docker compose up -d zookeeper postgres
          sleep 30

      - name: Inspect infrastructure
        run: |
          docker compose ps
          docker compose logs --no-color zookeeper --tail=100

      - name: Start Kafka
        run: |
          docker compose up -d --no-deps kafka
          sleep 30
          docker compose ps
          docker compose logs --no-color kafka --tail=100

      - name: Start application services
        run: |
          docker compose up -d --no-deps routing-engine ingestion-service kafka-ui
          sleep 30
          docker compose ps

      - name: Show routing engine logs
        run: |
          docker compose logs --no-color routing-engine --tail=200 || true

      - name: Show ingestion logs
        run: |
          docker compose logs --no-color ingestion-service --tail=200 || true

      - name: Show all service logs
        run: |
          docker compose logs --no-color --tail=200 || true

      - name: Inspect Kafka topics
        run: |
          echo "===== KAFKA TOPICS ====="
          docker exec dptrb-kafka kafka-topics \
            --bootstrap-server localhost:9092 \
            --list || true

          echo ""
          echo "===== RIDERSHIP RAW EVENTS ====="
          docker exec dptrb-kafka kafka-console-consumer \
            --bootstrap-server localhost:9092 \
            --topic ridership.events.raw \
            --from-beginning \
            --max-messages 10 \
            --timeout-ms 5000 || true

          echo ""
          echo "===== ROUTING ALERTS ====="
          docker exec dptrb-kafka kafka-console-consumer \
            --bootstrap-server localhost:9092 \
            --topic routing.alerts \
            --from-beginning \
            --max-messages 20 \
            --timeout-ms 5000 || true

          echo ""
          echo "===== ROUTING RECOMMENDATIONS ====="
          docker exec dptrb-kafka kafka-console-consumer \
            --bootstrap-server localhost:9092 \
            --topic routing.recommendations \
            --from-beginning \
            --max-messages 20 \
            --timeout-ms 5000 || true

      - name: Shutdown
        if: always()
        run: |
          docker compose down -v
