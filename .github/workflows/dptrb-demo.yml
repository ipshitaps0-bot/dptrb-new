name: DPTRB Demo

on:
  workflow_dispatch:

jobs:
  run-dptrb:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare DPTRB project structure
        run: |
          mkdir -p services/routing
          mkdir -p services/ingestion
          mkdir -p db

          # Go routing engine
          cp Dockerfile services/routing/Dockerfile
          cp go.mod services/routing/go.mod
          cp *.go services/routing/

          # Python ingestion service
          cp ingestion_service.py services/ingestion/
          cp requirements.txt services/ingestion/

          cat > services/ingestion/Dockerfile <<'EOF'
          FROM python:3.12-slim

          RUN groupadd -r dptrb && useradd -r -g dptrb dptrb

          WORKDIR /app

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY ingestion_service.py .

          USER dptrb

          ENTRYPOINT ["python", "ingestion_service.py"]
          EOF

          # Database initialization
          cp init.sql db/

          echo "Prepared DPTRB project structure:"
          find services db -maxdepth 3 -type f | sort

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build DPTRB images
        run: |
          docker compose build

      - name: Start infrastructure
        run: |
          docker compose up -d zookeeper postgres

      - name: Wait for infrastructure
        run: |
          echo "Waiting for ZooKeeper and PostgreSQL..."

          for i in {1..30}; do
            ZK_STATUS=$(docker inspect --format='{{.State.Health.Status}}' dptrb-zookeeper 2>/dev/null || echo "missing")
            PG_STATUS=$(docker inspect --format='{{.State.Health.Status}}' dptrb-postgres 2>/dev/null || echo "missing")

            echo "Attempt $i/30: ZooKeeper=$ZK_STATUS PostgreSQL=$PG_STATUS"

            if [ "$ZK_STATUS" = "healthy" ] && [ "$PG_STATUS" = "healthy" ]; then
              echo "Infrastructure is healthy."
              break
            fi

            if [ "$ZK_STATUS" = "unhealthy" ] || [ "$PG_STATUS" = "unhealthy" ]; then
              echo "Infrastructure health check failed."
              docker compose ps
              docker compose logs --no-color zookeeper --tail=50 || true
              docker compose logs --no-color postgres --tail=50 || true
              exit 1
            fi

            sleep 5
          done

          ZK_STATUS=$(docker inspect --format='{{.State.Health.Status}}' dptrb-zookeeper)
          PG_STATUS=$(docker inspect --format='{{.State.Health.Status}}' dptrb-postgres)

          if [ "$ZK_STATUS" != "healthy" ] || [ "$PG_STATUS" != "healthy" ]; then
            echo "Infrastructure did not become healthy in time."
            docker compose ps
            exit 1
          fi

      - name: Start Kafka
        run: |
          docker compose up -d kafka

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka..."

          for i in {1..30}; do
            KAFKA_STATUS=$(docker inspect --format='{{.State.Health.Status}}' dptrb-kafka 2>/dev/null || echo "missing")

            echo "Attempt $i/30: Kafka=$KAFKA_STATUS"

            if [ "$KAFKA_STATUS" = "healthy" ]; then
              echo "Kafka is healthy."
              break
            fi

            if [ "$KAFKA_STATUS" = "unhealthy" ]; then
              echo "Kafka health check failed."
              docker compose ps
              docker compose logs --no-color kafka --tail=100 || true
              exit 1
            fi

            sleep 5
          done

          KAFKA_STATUS=$(docker inspect --format='{{.State.Health.Status}}' dptrb-kafka)

          if [ "$KAFKA_STATUS" != "healthy" ]; then
            echo "Kafka did not become healthy in time."
            docker compose ps
            docker compose logs --no-color kafka --tail=100 || true
            exit 1
          fi

      - name: Start application services
        run: |
          docker compose up -d routing-engine ingestion-service kafka-ui
          sleep 15
          docker compose ps

      - name: Verify Kafka topic and messages
        run: |
          echo "Checking Kafka topic..."

          docker exec dptrb-kafka \
            kafka-topics --bootstrap-server localhost:9092 \
            --list

          echo ""
          echo "Checking ridership.events.raw..."

          docker exec dptrb-kafka \
            kafka-topics --bootstrap-server localhost:9092 \
            --describe --topic ridership.events.raw

          echo ""
          echo "Reading a sample of produced ridership events..."

          timeout 15 docker exec dptrb-kafka \
            kafka-console-consumer \
            --bootstrap-server localhost:9092 \
            --topic ridership.events.raw \
            --from-beginning \
            --max-messages 5 || true

      - name: Verify PostgreSQL persistence
        run: |
          echo "Checking PostgreSQL..."

          docker exec dptrb-postgres \
            psql -U dptrb_service -d dptrb -c "\dt"

          echo ""
          echo "Checking ridership event count..."

          docker exec dptrb-postgres \
            psql -U dptrb_service -d dptrb \
            -c "SELECT COUNT(*) AS ridership_event_count FROM ridership_events;"

      - name: Show routing engine logs
        run: |
          echo "===== ROUTING ENGINE ====="
          docker compose logs --no-color --tail=80 routing-engine || true

      - name: Show ingestion logs
        run: |
          echo "===== INGESTION SERVICE ====="
          docker compose logs --no-color --tail=80 ingestion-service || true

      - name: Final service status
        run: |
          echo "===== FINAL DPTRB STATUS ====="
          docker compose ps

      - name: Shutdown
        if: always()
        run: |
          docker compose down -v
