version: "3.9"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: dptrb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transit-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dptrb-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - transit-net

  postgres:
    image: postgres:16-alpine
    container_name: dptrb-postgres
    environment:
      POSTGRES_USER: dptrb_service
      POSTGRES_PASSWORD: dptrb_local_dev_password
      POSTGRES_DB: dptrb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dptrb_service -d dptrb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transit-net

  routing-engine:
    build:
      context: ./services/routing
      dockerfile: Dockerfile
    container_name: dptrb-routing-engine
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: postgres://dptrb_service:dptrb_local_dev_password@postgres:5432/dptrb?sslmode=disable
      WORKER_POOL_SIZE: "8"
    restart: unless-stopped
    networks:
      - transit-net

  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: dptrb-ingestion-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      STATION_IDS: "STN-001,STN-002,STN-003,STN-004"
      EVENTS_PER_SECOND: "15"
    restart: unless-stopped
    networks:
      - transit-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: dptrb-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dptrb-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - transit-net

volumes:
  postgres_data:

networks:
  transit-net:
    driver: bridge
